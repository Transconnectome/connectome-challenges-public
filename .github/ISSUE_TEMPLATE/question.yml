name: 질문하기
description: 설치나 실행이 막혔거나 과제 내용이 궁금할 때
title: "[질문] "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        이슈는 누구나 볼 수 있습니다. 개인정보(전화번호, 학번, 메일, 지원번호)와 API 키(`OPENROUTER_API_KEY`)는 절대 적지 마세요. 이름도 적지 않아도 됩니다.
        **인턴십 2단계 지원자 안내**: 2026 동계 인턴십 2단계 공식 과제는 **ROCF VLM(`CU + MCI`)**으로 통합되었습니다. 지원자의 과제 코드, 풀이 전략, 비공개 저장소 주소는 공개 이슈에 올리지 마세요(환경·규격 확인 등 일반 질문만 가능).
        답변은 연구실 구성원이 가능한 범위에서 드리며, 응답 시간은 보장하지 않습니다.
  - type: dropdown
    id: challenge
    attributes:
      label: 어느 챌린지인가요?
      options:
        - EEG · 뇌파에서 눈 깜빡임 흔적 찾아보기
        - fMRI · 뇌 영역의 신호는 함께 움직일까?
        - ROCF VLM · 복합도형 그리기 과정으로 아밀로이드 베타 예측하기
        - 시작 안내·설치
        - 기타
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: 무엇이 궁금하거나 막혔나요?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: 실행한 명령과 나온 메시지
      description: 오류 메시지는 잘라내지 말고 그대로 붙여 넣어 주세요. 단, 경로에 든 내 사용자 이름은 지워 주세요.
      render: text
  - type: input
    id: environment
    attributes:
      label: 환경
      placeholder: "예: macOS 14 (Apple 칩), Python 3.12"
